# Content for the Morning Brief and This Week screens that doesn't come from a
# calendar or weather.
# Edit, commit and push; the board picks up changes on its next refresh
# (this folder is mounted into the container, so no rebuild is needed).

# Three tiles at the bottom of the morning brief.
tiles:
