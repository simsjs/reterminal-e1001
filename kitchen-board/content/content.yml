# Content for the This Week screen that doesn't come from a calendar.
# Edit, commit and push; the board picks up changes on its next refresh
# (this folder is mounted into the container, so no rebuild is needed).

# Shown along the bottom of This Week (first 4) only until Google Tasks is set
# up (see "Reminders from Google Tasks" in docs/SETUP.md). After that, this list
# is ignored.
reminders:
  - Library books due Fri
  - Swap furnace filter
  - "RSVP: Thanksgiving dinner"

# Holidays for the countdown on This Week come from Google's "Holidays in United
# States" calendar. Add your own dates here (birthdays, trips); the nearest of
# these or the next holiday is shown. show_within_days defaults to 60.
countdowns: []
#  - { name: Beach trip, date: 2027-07-10, show_within_days: 30 }
