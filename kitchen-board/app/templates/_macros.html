{% macro header(board_name, title, page_index, page_count, updated) %}
<div class="kbh">
  <div class="dots">{% for i in range(page_count) %}<div class="dot{{ ' on' if i == page_index }}"></div>{% endfor %}</div>
  <div class="hdr-title">{% if board_name %}{{ board_name }} · {% endif %}{{ title }}</div>
  <div class="hdr-right">
    <span class="upd">UPDATED {{ updated }}</span>
    <svg class="wifi %%WIFI_CLASS%%" viewBox="0 0 21 16"><path class="w3" d="M1.6 5.6a12.6 12.6 0 0 1 17.8 0"/><path class="w2" d="M4.6 8.7a8.3 8.3 0 0 1 11.8 0"/><circle cx="10.5" cy="13.2" r="2.1"/></svg>
    <div class="batt"><div class="batt-fill" style="width:%%BATTERY_FILL%%px"></div></div>
    <span>%%BATTERY%%%</span>
  </div>
</div>
{% endmacro %}

{% macro wx_icon(kind) %}
<svg class="wx-icon" viewBox="0 0 60 52">
{% if kind == "sun" %}
  <circle cx="30" cy="26" r="10"/>
  <path d="M30 6v6M30 40v6M10 26h6M44 26h6M15.9 11.9l4.2 4.2M39.9 35.9l4.2 4.2M15.9 40.1l4.2-4.2M39.9 16.1l4.2-4.2"/>
{% elif kind == "partly" %}
  <path d="M13 6.5v4.5M2.5 17h4.5M5.3 9.3l3 3M20.7 9.3l-3 3"/>
  <path d="M8.5 22.5a7 7 0 1 1 12.4-6"/>
  <path d="M17 47.5h28a8.5 8.5 0 0 0 1-16.9 12.5 12.5 0 0 0-24.3-1.8A9.5 9.5 0 0 0 17 47.5z"/>
{% elif kind == "rain" %}
  <path d="M15 33h28a8.5 8.5 0 0 0 1-16.9 12.5 12.5 0 0 0-24.3-1.8A9.5 9.5 0 0 0 15 33z"/>
  <path d="M20 39l-3 7M30 39l-3 7M40 39l-3 7"/>
{% elif kind == "snow" %}
  <path d="M15 33h28a8.5 8.5 0 0 0 1-16.9 12.5 12.5 0 0 0-24.3-1.8A9.5 9.5 0 0 0 15 33z"/>
  <path d="M20 39v8M16.5 41l7 4M23.5 41l-7 4M38 39v8M34.5 41l7 4M41.5 41l-7 4"/>
{% elif kind == "storm" %}
  <path d="M15 33h28a8.5 8.5 0 0 0 1-16.9 12.5 12.5 0 0 0-24.3-1.8A9.5 9.5 0 0 0 15 33z"/>
  <path d="M31 36l-5 8h7l-4 7"/>
{% elif kind == "fog" %}
  <path d="M15 27h28a8.5 8.5 0 0 0 1-16.9 12.5 12.5 0 0 0-24.3-1.8A9.5 9.5 0 0 0 15 27z"/>
  <path d="M10 35h38M14 42h34M10 49h30"/>
{% else %}
  <path d="M12 42h32a10 10 0 0 0 1.2-19.9A14.5 14.5 0 0 0 17 20.3 11 11 0 0 0 12 42z"/>
{% endif %}
</svg>
{% endmacro %}
