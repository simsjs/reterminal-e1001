# LaraPaper (TRMNL server) + the calendar screens, Polestar, home energy, fitness and weather screens, on the Raspberry Pi.
#
#   cd ~/reterminal-e1001/larapaper
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
# The project name is pinned to "larapaper" so Docker reuses the volumes
# (larapaper_database, larapaper_storage) from the original ~/larapaper setup.
name: larapaper

services:
  app:
    image: ghcr.io/usetrmnl/larapaper:latest
    restart: unless-stopped
    ports:
      - "4567:8080"
    environment:
      - PHP_OPCACHE_ENABLE=1
      - TRMNL_PROXY_REFRESH_MINUTES=15
      - DB_DATABASE=database/storage/database.sqlite
      - APP_KEY=${APP_KEY:?Set APP_KEY in .env}
      - APP_URL=${APP_URL:?Set APP_URL in .env}
    volumes:
      - database:/var/www/html/database/storage
      - storage:/var/www/html/storage/app/public/images/generated

  kitchen-board:
    build: ../kitchen-board
    restart: unless-stopped
    ports:
      - "4568:8080"   # preview in a browser: http://<pi-ip>:4568/brief
    environment:
      - TZ=${TZ:-America/New_York}
      - WEATHER_LAT=${WEATHER_LAT:-38.8462}
      - WEATHER_LON=${WEATHER_LON:--77.3064}
      - CALENDAR_ICS_URLS=${CALENDAR_ICS_URLS:-}
      - BRIEF_ONLY_ICS_URLS=${BRIEF_ONLY_ICS_URLS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_TASKS_REFRESH_TOKEN=${GOOGLE_TASKS_REFRESH_TOKEN:-}
      - TASKS_LISTS=${TASKS_LISTS:-}
      - TASKS_DAYS_AHEAD=${TASKS_DAYS_AHEAD:-7}
      - TASKS_INCLUDE_UNDATED=${TASKS_INCLUDE_UNDATED:-off}
      - BRIEF_ENABLED=${BRIEF_ENABLED:-off}
      - FONT_BASE_URL=${FONT_BASE_URL:-http://kitchen-board:8080}
      - PAGE_COUNT=${KB_PAGE_COUNT:-5}   # header dots: This Week + Polestar + home energy + fitness + weather
    volumes:
      # A folder mount, so edits to content.yml show up after a git pull.
      - ../kitchen-board/content:/app/content:ro

  polestar-bridge:
    build: ../polestar/bridge
    restart: unless-stopped
    ports:
      - "4569:8765"   # car images page: http://<pi-ip>:4569/images?token=<POLESTAR_BRIDGE_TOKEN>
    environment:
      - TZ=${TZ:-America/New_York}
      - POLESTAR_USERNAME=${POLESTAR_USERNAME:-}
      - POLESTAR_PASSWORD=${POLESTAR_PASSWORD:-}
      - BRIDGE_TOKEN=${POLESTAR_BRIDGE_TOKEN:-}
      - CAR_NAMES=${POLESTAR_CAR_NAMES:-}
      - POLESTAR_VINS=${POLESTAR_VINS:-}
      - REFRESH_MINUTES=${POLESTAR_REFRESH_MINUTES:-10}
      - DEMO=${POLESTAR_DEMO:-0}
      - POLESTAR_BATTERY_KWH=${POLESTAR_BATTERY_KWH:-}
      - LOGO_FILE=/app/images/logo.png
      - PHOTO_FILE=/app/images/cars
    volumes:
      # Your own images (not in git): logo.png and a cars/ folder of car pictures.
      - ../polestar/images:/app/images:ro
      # Driving history for the self-calculated efficiency.
      - polestar:/data

  dominion-bridge:
    build: ../dominion/bridge
    restart: unless-stopped
    ports:
      - "4570:8765"   # raw data: http://<pi-ip>:4570/dominion.json?token=<DOMINION_BRIDGE_TOKEN>
    environment:
      - TZ=${TZ:-America/New_York}
      - BRIDGE_TOKEN=${DOMINION_BRIDGE_TOKEN:-}
      - DOMINION_ACCOUNT=${DOMINION_ACCOUNT:-}
      - DOMINION_METER=${DOMINION_METER:-}
      - REFRESH_MINUTES=${DOMINION_REFRESH_MINUTES:-120}
      - DEMO=${DOMINION_DEMO:-0}
      - LOGO_FILE=/app/images/logo.png
    volumes:
      # Tokens and login cookies from the one-time `dompower login` (see dominion/README.md).
      - dominion:/data
      - ../dominion/images:/app/images:ro

  strava-bridge:
    build: ../strava/bridge
    restart: unless-stopped
    ports:
      - "4571:8765"   # raw data: http://<pi-ip>:4571/fitness.json?token=<STRAVA_BRIDGE_TOKEN>
    environment:
      - TZ=${TZ:-America/New_York}
      - BRIDGE_TOKEN=${STRAVA_BRIDGE_TOKEN:-}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN:-}
      - REFRESH_MINUTES=${STRAVA_REFRESH_MINUTES:-15}
      - STRENGTH_TYPES=${STRAVA_STRENGTH_TYPES:-WeightTraining,Workout,Crossfit,HIIT}
      - RUCK_WORDS=${STRAVA_RUCK_WORDS:-ruck}
      - DEMO=${STRAVA_DEMO:-0}
      - DEMO_LAYOUT=${STRAVA_DEMO_LAYOUT:-ride}
    volumes:
      # The newest Strava refresh token (Strava can hand out a new one on any refresh).
      - strava:/data

  weather-bridge:
    build: ../weather/bridge
    restart: unless-stopped
    ports:
      - "4572:8765"   # raw data: http://<pi-ip>:4572/weather.json
    environment:
      - TZ=${TZ:-America/New_York}
      - WEATHER_LAT=${WEATHER_LAT:-38.8462}
      - WEATHER_LON=${WEATHER_LON:--77.3064}
      - WEATHER_PLACE=${WEATHER_PLACE:-Fairfax}
      - BRIDGE_TOKEN=${WEATHER_BRIDGE_TOKEN:-}
      - REFRESH_MINUTES=${WEATHER_REFRESH_MINUTES:-15}
      - ALERTS=${WEATHER_ALERTS:-on}
      - DEMO=${WEATHER_DEMO:-0}

volumes:
  database:
  storage:
  dominion:
  strava:
  polestar:
