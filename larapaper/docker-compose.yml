# LaraPaper (TRMNL server) + the calendar screens, Polestar, home energy, fitness and weather screens, on the Raspberry Pi.
#
#   cd ~/reterminal-e1001/larapaper
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#
# The project name is pinned to "larapaper" so Docker reuses the volumes
# (larapaper_database, larapaper_storage) from the original ~/larapaper setup.
#
# Only LaraPaper (4567) is open to the home network, because the E1001 needs it.
# The other services listen on the Pi itself (LOCAL_BIND, default 127.0.0.1);
# LaraPaper reaches them by container name. To open one in a browser on your
# laptop, tunnel it over SSH (see "Previews and raw data" in the README).
name: larapaper

services:
  app:
    # Pinned so LaraPaper only changes when we choose to. To upgrade on purpose:
    # pick a release at https://github.com/usetrmnl/larapaper/releases, run
    #   docker buildx imagetools inspect ghcr.io/usetrmnl/larapaper:<version>
    # put that version and its "Digest:" line below, then `docker compose up -d app`.
    # Back up first (sudo systemctl start piberry-backup.service).
    image: ghcr.io/usetrmnl/larapaper:0.47.0@sha256:9f22c462265e4e9cbf6ce2604d59205e6dd3f3cafb89a5d7adddeb81f6349666
    restart: unless-stopped
    ports:
      - "4567:8080"
    environment:
      - PHP_OPCACHE_ENABLE=1
      - TRMNL_PROXY_REFRESH_MINUTES=15
      - DB_DATABASE=database/storage/database.sqlite
      - APP_KEY=${APP_KEY:?Set APP_KEY in .env}
      - APP_URL=${APP_URL:?Set APP_URL in .env}
    volumes:
      - database:/var/www/html/database/storage
      - storage:/var/www/html/storage/app/public/images/generated

  kitchen-board:
    build: ../kitchen-board
    restart: unless-stopped
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:4568:8080"   # preview, from the Pi only: http://localhost:4568/week
    environment:
      - TZ=${TZ:-America/New_York}
      - SCREEN_ORDER=${SCREEN_ORDER:-week,polestar,energy,fitness,weather}   # page dots, see README
      - CALENDAR_ICS_URLS=${CALENDAR_ICS_URLS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_TASKS_REFRESH_TOKEN=${GOOGLE_TASKS_REFRESH_TOKEN:-}
      - TASKS_LISTS=${TASKS_LISTS:-}
      - TASKS_DAYS_AHEAD=${TASKS_DAYS_AHEAD:-7}
      - TASKS_INCLUDE_UNDATED=${TASKS_INCLUDE_UNDATED:-off}
      - FONT_BASE_URL=${FONT_BASE_URL:-http://kitchen-board:8080}
    volumes:
      # A folder mount, so edits to content.yml show up after a git pull.
      - ../kitchen-board/content:/app/content:ro

  dominion-bridge:
    build: ../dominion/bridge
    restart: unless-stopped
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:4570:8765"   # raw data, from the Pi only: http://localhost:4570/dominion.json?token=<DOMINION_BRIDGE_TOKEN>
    environment:
      - TZ=${TZ:-America/New_York}
      - SCREEN_ORDER=${SCREEN_ORDER:-week,polestar,energy,fitness,weather}   # page dots, see README
      - BRIDGE_TOKEN=${DOMINION_BRIDGE_TOKEN:-}
      - DOMINION_ACCOUNT=${DOMINION_ACCOUNT:-}
      - DOMINION_METER=${DOMINION_METER:-}
      - REFRESH_MINUTES=${DOMINION_REFRESH_MINUTES:-120}
      - DEMO=${DOMINION_DEMO:-0}
      - LOGO_FILE=/app/images/logo.png
    volumes:
      # Tokens and login cookies from the one-time `dompower login` (see dominion/README.md).
      - dominion:/data
      - ../dominion/images:/app/images:ro

  # One service for the screens that need outside data. Each screen keeps its
  # own routes and token; the aliases keep the recipes' old Bridge URLs working.
  bridges:
    build: ../bridges
    restart: unless-stopped
    networks:
      default:
        aliases:
          - weather-bridge
          - strava-bridge
          - polestar-bridge
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:4569:8765"   # Polestar car images page, from the Pi only: http://localhost:4569/images?token=<POLESTAR_BRIDGE_TOKEN>
      - "${LOCAL_BIND:-127.0.0.1}:4571:8765"   # fitness raw data, from the Pi only: http://localhost:4571/fitness.json?token=<STRAVA_BRIDGE_TOKEN>
      - "${LOCAL_BIND:-127.0.0.1}:4572:8765"   # weather raw data, from the Pi only: http://localhost:4572/weather.json
    environment:
      - TZ=${TZ:-America/New_York}
      - SCREEN_ORDER=${SCREEN_ORDER:-week,polestar,energy,fitness,weather}   # page dots, see README
      # Weather screen
      - WEATHER_LAT=${WEATHER_LAT:-38.8462}
      - WEATHER_LON=${WEATHER_LON:--77.3064}
      - WEATHER_PLACE=${WEATHER_PLACE:-Fairfax}
      - WEATHER_BRIDGE_TOKEN=${WEATHER_BRIDGE_TOKEN:-}
      - WEATHER_REFRESH_MINUTES=${WEATHER_REFRESH_MINUTES:-15}
      - WEATHER_ALERTS=${WEATHER_ALERTS:-on}
      - WEATHER_SCENE=${WEATHER_SCENE:-auto}
      - WEATHER_DEMO=${WEATHER_DEMO:-0}
      # Fitness screen (Strava)
      - STRAVA_BRIDGE_TOKEN=${STRAVA_BRIDGE_TOKEN:-}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN:-}
      - STRAVA_REFRESH_MINUTES=${STRAVA_REFRESH_MINUTES:-15}
      - STRAVA_STRENGTH_TYPES=${STRAVA_STRENGTH_TYPES:-WeightTraining,Workout,Crossfit,HIIT}
      - STRAVA_RUCK_WORDS=${STRAVA_RUCK_WORDS:-ruck}
      - STRAVA_DEMO=${STRAVA_DEMO:-0}
      - STRAVA_DEMO_LAYOUT=${STRAVA_DEMO_LAYOUT:-ride}
      # Polestar screen
      - POLESTAR_USERNAME=${POLESTAR_USERNAME:-}
      - POLESTAR_PASSWORD=${POLESTAR_PASSWORD:-}
      - POLESTAR_BRIDGE_TOKEN=${POLESTAR_BRIDGE_TOKEN:-}
      - POLESTAR_CAR_NAMES=${POLESTAR_CAR_NAMES:-}
      - POLESTAR_VINS=${POLESTAR_VINS:-}
      - POLESTAR_REFRESH_MINUTES=${POLESTAR_REFRESH_MINUTES:-10}
      - POLESTAR_DEMO=${POLESTAR_DEMO:-0}
      - POLESTAR_BATTERY_KWH=${POLESTAR_BATTERY_KWH:-}
    volumes:
      # Your own pictures of the house for each season and weather (not in git).
      - ../weather/images:/app/images/weather:ro
      # The newest Strava refresh token (Strava can hand out a new one on any refresh).
      - strava:/data/strava
      # Your own Polestar images (not in git): logo.png and a cars/ folder of car pictures.
      - ../polestar/images:/app/images/polestar:ro
      # Polestar driving history for the self-calculated efficiency.
      - polestar:/data/polestar

volumes:
  database:
  storage:
  dominion:
  strava:
  polestar:
